<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech & AI ミニクイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Tech & AI ミニクイズ</h1>
      <p>テクノロジーと社会の知識をチェックしよう！</p>
    </header>

    <main id="quiz-box">
      <div class="progress" id="progress">第 1 問 / 全 3 問</div>
      <h2 id="question">問題文がここに表示されます</h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="btn hidden">次の問題へ</button>
    </main>

    <section id="result-box" class="hidden">
      <h2>結果発表！</h2>
      <p id="score-text" class="score"></p>
      <p id="comment-text"></p>
      <button id="restart-btn" class="btn">もう一度挑戦する</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
